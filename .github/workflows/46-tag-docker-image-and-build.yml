name: "46-tag-docker-image"
on:
  pull_request:

jobs:
  publish-docker-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    outputs:
      ghcr-url: ghcr.io/${{ steps.configure-url.outputs.REPO }}:${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Log in to the Container registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=pr
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: flatten output
        id: configure-url
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Get Public IP
        id: ip
        uses: haythem/public-ip@v1.3

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.configure-url.outputs.REPO }}:buildcache
      #god willing, this is temporary until I come up with a better solution

  deploy:
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: read
      deployments: write
    needs: publish-docker-image
    concurrency: 
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    uses: ucsb-cs156/dokku-review-apps/.github/workflows/deploy-app.yml@main
    with:
      docker_image: ${{ needs.publish-docker-image.outputs.ghcr-url }}
      template_app_name: ${{ vars.TEMPLATE_APP_NAME }}
      host_url: ${{ vars.HOST_URL }}
    secrets:
      PORT: ${{ secrets.PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
